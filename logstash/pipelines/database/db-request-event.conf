input {
    jdbc {
        jdbc_driver_library => "${JDBC_LIBRARY}"
        jdbc_driver_class => "${JDBC_DRIVER_CLASS}"
        jdbc_connection_string => "${JDBC_CONNECTION_STRING}"
        jdbc_user => "${JDBC_USER}"
        jdbc_password => "${JDBC_PASSWORD}"
        last_run_metadata_path => "${LAST_RUN_DIR}/jdbc.request_event.last_run"
        schedule => "${JDBC_SCHEDULE}"

        jdbc_paging_enabled => true
        tracking_column => "instant_unix"
        use_column_value => true
        tracking_column_type => "numeric"

        statement => "
            SELECT
                instant_unix            = DATEDIFF(SECOND,'2021-01-01', instant),
                application_key         = re.[APPLICATIONKEY],
                application_name        = re.[APPLICATIONNAME],
                import_latency          = DATEDIFF(minute, re.[Instant],GETDATE()),
                instant                 = re.[INSTANT],
                application_module_key  = re.[MODULEKEY],
                application_module_name = re.[MODULENAME],
                request_key             = re.[REQUESTKEY],
                request_event_name      = re.[REQUESTEVENTNAME],
                request_event_details   = re.[EVENTDETAILS]
            FROM
                [dbo].[oslog_RequestEvent] (nolock) re
            WHERE DATEDIFF(SECOND,'2021-01-01', instant) > :sql_last_value
        "
    }
}

filter {
    #------------------------------------------------------------------------------#
    # Common part
    #------------------------------------------------------------------------------#
    mutate {
        add_field => {
            "[outsystems][customer][name]" => "${DATA_CUSTOMER_NAME}"
            "[outsystems][location][name]" => "${DATA_LOCATION_NAME}"
            "[deployment][environment]" => "${DATA_ENVIRONMENT_NAME}"
        }

        convert => [ "instant", "string" ] # we need to convert this to a string to be able to parse it into the @timestamp field

        remove_field => [ "instant_unix" ] # this field was only used for controling the query pagination, so we don't need to keep it
    }

    date {
        match => ["instant", "ISO8601"]
        timezone => "Etc/UTC"
    }

    mutate {
        rename => { "instant" => "[log][instant]" } # the value of this field is now in the @timestamp field, so we just keep it as a control value
    }

    #------------------------------------------------------------------------------#
    # Specific part
    #
    # OTEL semantic alignment (see Documentation/OTEL-Field-Mapping.md):
    # OutSystems log streaming keeps the EventDetails JSON keys as-is (lowercased)
    # under outsystems.request.event.details.*, e.g. details.d, details.tqt,
    # details.tcit. We mirror that here instead of expanding to custom names, so
    # the same dashboards work for both ingestion tracks.
    #------------------------------------------------------------------------------#
    fingerprint {
        source => [
                "[log][instant]",
                "[application_key]",
                "[request_key]",
                "[application_module_key]",
                "[request_event_name]"
        ]
        target => "[@metadata][fingerprint]"
        method => "MURMUR3"
        concatenate_sources => true
    }

    json {
        source => "request_event_details"
        target => "[outsystems][request][event][details]"
    }

    ruby {
        code => '
            details = event.get("[outsystems][request][event][details]")
            if details.is_a?(Hash)
                event.set("[outsystems][request][event][details]", details.transform_keys(&:downcase))
            end
        '
    }

    mutate {
        add_field => { "[outsystems][log][type]" => "RequestEvent" }

        rename => {
            "application_key" => "[outsystems][app][key]"
            "application_name" => "[outsystems][app][name]"
            "application_module_key" => "[outsystems][module][key]"
            "application_module_name" => "[outsystems][module][name]"
            "import_latency" => "[outsystems][logstash][import_latency]"
            "request_key" => "[outsystems][request][key]"
            "request_event_name" => "[outsystems][log][event][type]"
            "request_event_details" => "[content]" # raw EventDetails JSON is the log body, like streaming
        }
    }
}

output {
    dynatrace {
    	#id => "optional"
    	ingest_endpoint_url => "${DT_ENDPOINT}"
    	api_key => "${DT_APIKEY}"
    	# Only set DT_VERIFYSSLNONE=true for self-signed endpoints (e.g. ActiveGate); leave unset otherwise
    	ssl_verify_none => "${DT_VERIFYSSLNONE:false}"
  	}
}
