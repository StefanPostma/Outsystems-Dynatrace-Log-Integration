input {
    jdbc {
        jdbc_driver_library => "${JDBC_LIBRARY}"
        jdbc_driver_class => "${JDBC_DRIVER_CLASS}"
        jdbc_connection_string => "${JDBC_CONNECTION_STRING}"
        jdbc_user => "${JDBC_USER}"
        jdbc_password => "${JDBC_PASSWORD}"
        last_run_metadata_path => "${LAST_RUN_DIR}/jdbc.web_request.last_run"
        schedule => "${JDBC_SCHEDULE}"

        jdbc_paging_enabled => true
        tracking_column => "instant_unix"
        use_column_value => true
        tracking_column_type => "numeric"

        statement => "
            SELECT
                instant_unix            = DATEDIFF(SECOND,'2021-01-01', instant),
                web_request_access_mode = s.[Access_Mode],
                application_action_name = s.[Action_Name],
                application_key         = s.[Application_Key],
                application_name        = s.[Application_Name],
                duration                = s.[Duration],
                application_espace_id   = s.[Espace_Id],
                application_espace_name = s.[Espace_Name],
                application_executor    = s.[Executed_By],
                import_latency          = DATEDIFF(minute,s.[Instant],GETDATE()),
                instant                 = s.[Instant],
                web_request_msisdn      = s.[Msisdn],
                application_screen_name = s.[Screen],
                application_screen_type = s.[Screen_Type],
                session_size            = s.[Session_Bytes],
                session_id              = s.[Session_Id],
                session_requests        = s.[Session_Requests],
                tenant_id               = s.[Tenant_Id],
                user_id                 = s.[User_Id],
                user_name               = s.Username,
                request_viewstate_size  = s.[Viewstate_Bytes],
                request_key             = s.[Request_Key],
                application_client_ip   = s.[Client_IP]
            FROM [dbo].[oslog_Screen] (nolock) s
            WHERE DATEDIFF(SECOND,'2021-01-01', instant) > :sql_last_value
        "
    }
}

filter {
    #------------------------------------------------------------------------------#
    # Common part
    #------------------------------------------------------------------------------#
    mutate {
        add_field => {
            "[outsystems][customer][name]" => "${DATA_CUSTOMER_NAME}"
            "[outsystems][location][name]" => "${DATA_LOCATION_NAME}"
            "[deployment][environment]" => "${DATA_ENVIRONMENT_NAME}"
        }

        convert => [ "instant", "string" ] # we need to convert this to a string to be able to parse it into the @timestamp field

        remove_field => [ "instant_unix" ] # this field was only used for controling the query pagination, so we don't need to keep it
    }

    date {
        match => ["instant", "ISO8601"]
        timezone => "Etc/UTC"
    }

    mutate {
        rename => { "instant" => "[log][instant]" } # the value of this field is now in the @timestamp field, so we just keep it as a control value
    }

    #------------------------------------------------------------------------------#
    # Specific part
    #------------------------------------------------------------------------------#
    fingerprint {
        source => ["[request_key]"]
        target => "[@metadata][fingerprint]"
        method => "MURMUR3"
        concatenate_sources => true
    }

    mutate {
        add_field => { "[outsystems][log][type]" => "Screen" }

        rename => {
            "application_action_name" => "[code][function]"
            "application_key" => "[outsystems][app][key]"
            "application_name" => "[outsystems][app][name]"
            "application_executor" => "[outsystems][log][executed_by]"
            "application_espace_id" => "[outsystems][espace][id]"
            "application_espace_name" => "[outsystems][espace][name]"
            "application_screen_name" => "[outsystems][log][screen][name]"
            "application_screen_type" => "[outsystems][log][screen][type]"
            "application_client_ip" => "[http][client_ip]"
            "web_request_access_mode" => "[outsystems][log][screen][access_mode]"
            "web_request_msisdn" => "[outsystems][log][msisdn]"
            "import_latency" => "[outsystems][logstash][import_latency]"
            "request_key" => "[outsystems][request][key]"
            "request_viewstate_size" => "[outsystems][log][viewstate_bytes]"
            "session_id" => "[outsystems][user][session][id]"
            "session_size" => "[outsystems][traditional][ss]"
            "session_requests" => "[outsystems][traditional][sr]"
        }
    }

    range {
        ranges => [
                "duration",    0,        2000, "field:duration_class:Good",
                "duration", 2001,        6000, "field:duration_class:Fair",
                "duration", 6001,999999999999, "field:duration_class:Bad"
        ]
    }

    #------------------------------------------------------------------------------#
    # OTEL semantic alignment (see Documentation/OTEL-Field-Mapping.md)
    # Renames of fields that are absent in this pipeline are no-ops.
    #------------------------------------------------------------------------------#
    mutate {
        rename => {
            "duration" => "[outsystems][request][duration]"
            "duration_class" => "[outsystems][logstash][duration_class]"
            "tenant_id" => "[outsystems][tenant][id]"
            "user_id" => "[enduser][id]"
            "user_name" => "[outsystems][user][name]"
            "login_id" => "[outsystems][user][login_id]"
            "server_name" => "[host][name]"
            "client_ip" => "[http][client_ip]"
            "environment_information" => "[outsystems][log][environment_information]"
            "error_id" => "[outsystems][log][error][uid]"
        }
    }
}

output {
    dynatrace {
    	#id => "optional"
    	ingest_endpoint_url => "${DT_ENDPOINT}"
    	api_key => "${DT_APIKEY}"
  	}
}
