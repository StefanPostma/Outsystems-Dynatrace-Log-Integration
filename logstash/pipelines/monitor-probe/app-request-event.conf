input {
    http_poller {
        urls => {
            mp => {
                method => get
                url => "${MP_BASE_URL}/RequestEvents?MinutesBefore=${MP_INTERVAL}"
                user => "${MP_USER}"
                password => "${MP_PASSWORD}"
                headers => { Accept => "application/json" }
            }
        }
        request_timeout => "${MP_REQUEST_TIMEOUT}"
        socket_timeout => "${MP_SOCKET_TIMEOUT}"
        schedule => { every => "${MP_SCHEDULE}" }
        metadata_target => "http_poller_metadata"
    }
}

filter {
    mutate {
        convert => [ "instant", "string" ]
    }

    date {
        match => ["instant", "ISO8601"]
        timezone => "Etc/UTC"
    }

    #------------------------------------------------------------------------------#
    # OTEL semantic alignment (see Documentation/OTEL-Field-Mapping.md):
    # OutSystems log streaming keeps the EventDetails JSON keys as-is (lowercased)
    # under outsystems.request.event.details.*, e.g. details.d, details.tqt,
    # details.tcit. We mirror that here instead of expanding to custom names, so
    # the same dashboards work for both ingestion tracks.
    #------------------------------------------------------------------------------#
    mutate {
        add_field => {
            "[outsystems][customer][name]" => "${DATA_CUSTOMER_NAME}"
            "[outsystems][location][name]" => "${DATA_LOCATION_NAME}"
            "[deployment][environment]" => "${DATA_ENVIRONMENT_NAME}"
            "[outsystems][log][type]" => "RequestEvent"
        }

        remove_field => [ "name", "cycle", "http_poller_metadata" ]

        rename => {
            "instant" => "[log][instant]"
            "request_key" => "[outsystems][request][key]"
            "module_key" => "[outsystems][module][key]"
            "module_name" => "[outsystems][module][name]"
            "application_key" => "[outsystems][app][key]"
            "application_name" => "[outsystems][app][name]"
            "request_eventname" => "[outsystems][log][event][type]"
            "eventdetails" => "[outsystems][request][event][details]"
        }
    }

    ruby {
        code => '
            details = event.get("[outsystems][request][event][details]")
            if details.is_a?(Hash)
                event.set("[outsystems][request][event][details]", details.transform_keys(&:downcase))
            end
        '
    }

    fingerprint {
        source => [
            "[log][instant]",
            "[outsystems][app][key]",
            "[outsystems][request][key]",
            "[outsystems][module][key]",
            "[outsystems][log][event][type]"
        ]
        target => "[@metadata][fingerprint]"
        method => "MURMUR3"
        concatenate_sources => true
    }
}

output {
#    stdout { codec => rubydebug }

    dynatrace {
    	#id => "optional"
    	ingest_endpoint_url => "${DT_ENDPOINT}"
    	api_key => "${DT_APIKEY}"
  	}
}
