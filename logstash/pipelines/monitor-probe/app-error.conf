input {
    http_poller {
        urls => {
            mp => {
                method => get
                url => "${MP_BASE_URL}/Errors?MinutesBefore=${MP_INTERVAL}"
                user => "${MP_USER}"
                password => "${MP_PASSWORD}"
                headers => { Accept => "application/json" }
            }
        }
        request_timeout => "${MP_REQUEST_TIMEOUT}"
        socket_timeout => "${MP_SOCKET_TIMEOUT}"
        schedule => { every => "${MP_SCHEDULE}" }
        metadata_target => "http_poller_metadata"
    }
}

filter {
    mutate {
        rename => { "message" => "message_text" }
        convert => [ "instant", "string" ]
    }

    date {
        match => ["instant", "ISO8601"]
        timezone => "Etc/UTC"
    }

    mutate {
        add_field => {
            "[outsystems][customer][name]" => "${DATA_CUSTOMER_NAME}"
            "[outsystems][location][name]" => "${DATA_LOCATION_NAME}"
            "[deployment][environment]" => "${DATA_ENVIRONMENT_NAME}"
            "[outsystems][log][type]" => "Error"
        }

        remove_field => [ "name", "cycle", "http_poller_metadata" ]

        rename => {
            "instant" => "[log][instant]"
            "id" => "error_id"
            "session_id" => "[outsystems][user][session][id]"
            "espace_id" => "[outsystems][espace][id]"
            "espace_name" => "[outsystems][espace][name]"
            "message_text" => "[content]"
            "stack" => "[exception][stacktrace]"
            "module_name" => "[outsystems][module][name]"
            "request_key" => "[outsystems][request][key]"
            "application_name" => "[outsystems][app][name]"
            "server" => "server_name"
            "environmentinformation" => "environment_information"
            "action_name" => "[code][function]"
            "entrypoint_name" => "[outsystems][log][entrypoint_name]"
        }
    }

    fingerprint {
        source => ["[error_id]"]
        target => "[@metadata][fingerprint]"
        method => "MURMUR3"
        concatenate_sources => true
    }

    #------------------------------------------------------------------------------#
    # OTEL semantic alignment (see Documentation/OTEL-Field-Mapping.md)
    # Renames of fields that are absent in this pipeline are no-ops.
    #------------------------------------------------------------------------------#
    mutate {
        rename => {
            "duration" => "[outsystems][request][duration]"
            "duration_class" => "[outsystems][logstash][duration_class]"
            "tenant_id" => "[outsystems][tenant][id]"
            "user_id" => "[enduser][id]"
            "user_name" => "[outsystems][user][name]"
            "login_id" => "[outsystems][user][login_id]"
            "server_name" => "[host][name]"
            "client_ip" => "[http][client_ip]"
            "environment_information" => "[outsystems][log][environment_information]"
            "error_id" => "[outsystems][log][error][uid]"
        }
    }

    # Errors: expose the message under the OTEL exception namespace as well,
    # and keep a generic log uid next to the error uid (both are used by dashboards).
    mutate {
        copy => {
            "[content]" => "[exception][message]"
            "[outsystems][log][error][uid]" => "[outsystems][log][uid]"
        }
    }
}

output {
#    stdout { codec => rubydebug }
    dynatrace {
    	#id => "optional"
    	ingest_endpoint_url => "${DT_ENDPOINT}"
    	api_key => "${DT_APIKEY}"
  	}
}
